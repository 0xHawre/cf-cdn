[package]
name = "cf-cdn"
version = "0.2.0"
edition = "2021"
authors = ["Hawre"]
description = "VLESS/VMSS proxy with Cloudflare tunnel integration"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
tokio-tungstenite = "0.21"
futures = "0.3"
log = "0.4"
env_logger = "0.11"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
toml = "0.8"
uuid = { version = "1.6", features = ["v4", "serde"] }
hex = "0.4"
sha2 = "0.10"
bytes = "1.5"
base64 = "0.21"
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[dev-dependencies]
tokio-test = "0.4"

[[bin]]
name = "cf-cdn"
path = "src/main.rs"

[[bin]]
name = "tunnel-cli"
path = "src/bin/tunnel_cli.rs"

[[bin]]
name = "info"
path = "src/bin/info.rs"
